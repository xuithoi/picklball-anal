services:
  - type: web
    name: pickleball-kun-ai
    runtime: docker
    repo: https://github.com/xuithoi/picklball-anal
    branch: feat/pickleball-ai-mvp-autodelete
    region: singapore
    plan: standard
    numInstances: 1
    autoDeploy: false
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    disk:
      name: pickleball-data
      mountPath: /var/data
      sizeGB: 10
    envVars:
      - key: REQUIRE_AUTH
        value: "1"
      - key: APP_USERNAME
        value: kun
      - key: APP_PASSWORD
        generateValue: true
      - key: MAX_UPLOAD_MB
        value: "600"
      - key: RESULT_TTL_SECONDS
        value: "1800"
      - key: CLEANUP_INTERVAL_SECONDS
        value: "30"
